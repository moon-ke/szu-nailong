<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界奶龙大学</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FFF5F5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
  }

  .seal {
    width: 280px;
    height: auto;
    margin-bottom: 55px;
  }

  .title {
    font-size: 48px;
    font-weight: 600;
    color: #8B0000;
    margin-bottom: 16px;
    letter-spacing: 8px;
  }

  .subtitle {
    font-size: 18px;
    color: #999;
    margin-bottom: 40px;
  }
  .subtitle strong {
    color: #333;
    font-weight: 500;
  }

  .dot {
    display: inline-block;
    font-size: 24px;
    color: #333;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  .go {
    font-size: 15px;
    color: #8B0000;
    text-decoration: none;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<img class="seal" src="https://aka.doubaocdn.com/s/IvuVjqMjBr" alt="深圳奶龙大学校徽">

<h1 class="title">世界奶龙大学</h1>
<p class="subtitle">奶龙正在护送你前往 <strong>世界奶龙大学</strong><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
<a href="home.html" class="go">立即前往</a>

<script>
  setTimeout(function() {
    window.location.href = "home.html";
  }, 3000);
</script>

</body>
</html>
